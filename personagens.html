<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personagens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/personagens.css">
</head>
<body class="fundo-cenario">

  <main class="bloco bloco-personagens">
    <header class="topo">
      <a href="index.html" class="back-button" title="Voltar" aria-label="Voltar"><i class="bi bi-arrow-left-short"></i></a>
      <h1 class="titulo-pagina">Escolha seu personagem</h1>
    </header>

    <div class="grade-personagens">
      <button type="button" class="escolha" onclick="escolherPersonagem('heloisa')"><img src="imagens/heloisa.png" alt="Heloisa"></button>
      <button type="button" class="escolha" onclick="escolherPersonagem('nicolly')"><img src="imagens/nicolly.png" alt="Nicolly"></button>
      <button type="button" class="escolha" onclick="escolherPersonagem('maria')"><img src="imagens/maria.png" alt="Maria"></button>
      <button type="button" class="escolha" onclick="escolherPersonagem('gustavo')"><img src="imagens/gustavo.png" alt="Gustavo"></button>
      <button type="button" class="escolha" onclick="escolherPersonagem('amanda')"><img src="imagens/amanda.png" alt="Amanda"></button>
      <button type="button" class="escolha" onclick="escolherPersonagem('preto')"><img src="imagens/preto.png" alt="Preto"></button>
    </div>
  </main>

  <script>
    function escolherPersonagem(nome) {
      localStorage.setItem('personagemEscolhido', nome);
      window.location.href = 'fase-um.html';
    }
  </script>
</body>
</html>
