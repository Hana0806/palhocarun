<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seu brinde</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/fim.css">
  <script src="js/fim.js" defer></script>
</head>
<body class="fim">

  <main class="brinde">
    <h1>🎁 Seu brinde está quase na mão!</h1>
    <p class="intro">Falta pouco! Siga os passos abaixo para resgatar:</p>

    <ul class="passos">
      <li class="passo feito">
        <span class="marca" aria-hidden="true">✓</span>
        <span>Passou por todas as fases</span>
      </li>
      <li>
        <label class="passo">
          <input type="checkbox" id="passoSeguir" autocomplete="off">
          <span>Seguir <strong>@lanchonetepalhoca</strong> no Instagram</span>
        </label>
      </li>
    </ul>

    <a href="https://www.instagram.com/lanchonetepalhoca?stkn=cGVzYWduMm91ODQ2" target="_blank" rel="noopener" class="instagram-link">
      <i class="bi bi-instagram"></i>
      <span>Ir para o Instagram</span>
    </a>
    <p class="dica">Siga o perfil, volte aqui e marque os passos.</p>

    <div class="liberado" id="liberado" role="status" aria-live="polite" hidden>
      <strong>🎉 Brinde liberado!</strong>
      <span>Mostre esta tela ao atendente para receber o seu.</span>
    </div>
  </main>

  <a href="index.html" class="agradecimento">
    <strong>Obrigado por jogar!</strong>
    <span>Voltar ao início</span>
  </a>

</body>
</html>
