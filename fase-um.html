<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/jogo.css">
  <link rel="stylesheet" href="css/dialogo.css">
  <title>Gameplay</title>
  <script src="js/dialogo.js" defer></script>
</head>
<body class="tela-jogo dia" data-alvo="o Fabrício">

  <a href="personagens.html" class="back-button fixo" title="Voltar" aria-label="Voltar"><i class="bi bi-arrow-left-short"></i></a>
  <a href="jogo.html" class="botao-ui pular" id="botaoPular">Pular</a>
  <div class="jogo" id="jogo">
    <img src="imagens/coqueiro.png" alt="" class="coqueiro">
    <img class="personagem" id="personagem" alt="personagem">
    <img src="imagens/pescador.png" alt="Pescador" class="npc pescador" id="npc">
    <img src="imagens/nuvem.png" alt="" class="nuvem">
    <img src="imagens/nuvem.png" alt="" class="nuvem nuvem2">
    <div id="mensagem-npc" class="mensagem-npc">
      <h3 id="texto">
        Olá, aventureiro(a)! Seja bem-vindo(a) ao Palhoça Run!<br>
        Temos uma missão para você: precisamos recuperar a receita secreta que foi roubada. Consegue nos ajudar?
        Você precisará enfrentar 3 caminhos, e cada um será mais difícil que o anterior.
        Está pronto? Estamos contando com você!
      </h3>
      <a href="jogo.html" id="botaoContinuar" class="botao-ui">Continuar</a>
    </div>
  </div>

  <div id="tutorial"></div>

</html>
